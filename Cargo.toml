[workspace]
resolver = "2"
members = ["crates/hive-core", "crates/hive-discord", "src-tauri"]
default-members = ["crates/hive-core", "crates/hive-discord"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mike Holborn"]
repository = "https://github.com/Hewlbern/hive"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hive-core = { path = "crates/hive-core" }
